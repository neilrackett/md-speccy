; mdfw.ini - MD/Speccy built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/Speccy
output = build/md-speccy.mdfw
; Built on the SidecarTridge microfirmware template: its own main() runs,
; with EmuMD standing in for the template's hardware (romemul.c,
; commemul.c, select.c, hw_config.c and sdcard.c are left out) and the
; Booster. The version comes from version.txt. The sample UUID, as the
; Makefile falls back to, so a clone without uuid.txt builds too.
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; The firmware, as rp/src/CMakeLists.txt lists it. Left out:
; fb_core1.c (emu/ has a version a host can run).
files =
    emu/*.c
    rp/src/*.c
    rp/src/settings/settings.c
exclude =
    rp/src/fb_core1.c

[compile]
; emu/shim: stand-ins for headers that only make sense on the RP2040.
shims =
    emu/shim
include =
    rp/src/ff
    rp/src
    rp/src/include
    rp/src/settings
    rp/src/zx
    rp
; The emulator core's -O2 regions are GCC pragmas.
cflags = -O2 -Wno-unknown-pragmas

[run]
; The microSD card: the built-in games are seeded into emu/sd/speccy at
; boot; put your own .z80 / .sna files there too.
machine = ste
sd = emu/sd
